name: Publish Docker images

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      platform:
        description: >-
          Page app branding to bake in at build time (binance, coinbase or
          crypto_com). When set, the page image is tagged with this value
          instead of only latest/sha. Leave empty to build with the default.
        type: choice
        options:
          - ''
          - binance
          - coinbase
          - crypto_com
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin, page]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/binance-${{ matrix.app }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=raw,value=${{ inputs.platform }},enable=${{ matrix.app == 'page' && inputs.platform != '' }}
          flavor: |
            latest=false

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_PLATFORM=${{ inputs.platform }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
